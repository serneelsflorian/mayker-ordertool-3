name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend-unit:
    name: Backend — Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest tests/unit/ -v --cov=app --cov-report=xml --cov-fail-under=80
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-unit
          path: backend/coverage.xml

  backend-integration:
    name: Backend — Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ordertool
          POSTGRES_PASSWORD: ordertool
          POSTGRES_DB: ordertool_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://ordertool:ordertool@localhost:5432/ordertool_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest tests/integration/ -v

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [backend-unit, backend-integration]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ordertool
          POSTGRES_PASSWORD: ordertool
          POSTGRES_DB: ordertool_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://ordertool:ordertool@localhost:5432/ordertool_e2e
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        run: pip install -r backend/requirements.txt
      - name: Install frontend
        run: npm ci
        working-directory: frontend
      - name: Install E2E dependencies
        run: npm ci
        working-directory: e2e
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
        working-directory: e2e
      - name: Build frontend
        run: npm run build
        working-directory: frontend
      - name: Run database migrations
        run: alembic upgrade head
        working-directory: backend
      - name: Start backend
        run: uvicorn app.main:app --host 0.0.0.0 --port 8000 &
        working-directory: backend
      - name: Wait for backend
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && exit 0
            sleep 1
          done
          echo "Backend did not become ready in time" && exit 1
      - name: Run Playwright tests
        run: npx playwright test
        working-directory: e2e
        env:
          BASE_URL: http://localhost:5173
          API_URL: http://localhost:8000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report/

  mark-done:
    name: Mark feature done in ClickUp
    runs-on: ubuntu-latest
    needs: [backend-unit, backend-integration, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Extract feature ID from branch
        id: feature
        run: |
          BRANCH="${{ github.head_ref || github.ref_name }}"
          FEATURE_ID=$(echo "$BRANCH" | grep -oP '(?<=feature/)(STORY-\d+)' || true)
          echo "id=$FEATURE_ID" >> "$GITHUB_OUTPUT"
      - name: Update ClickUp status to done
        if: steps.feature.outputs.id != ''
        run: |
          echo "Feature ${{ steps.feature.outputs.id }} merged — ClickUp status update via MCP is handled by the framework agent."
